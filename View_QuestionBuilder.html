<div id="modal-question-builder" class="modal-overlay">
  <div class="modal-content" style="max-width:1200px; width:96%;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e7eb; padding-bottom:10px; margin-bottom:12px;">
      <h3 id="qb-title" style="margin:0; color:#d97706">Nhập Câu Hỏi</h3>
      <button onclick="app.closeImportModal()" style="border:none; background:none; font-size:1.5em; cursor:pointer; color:#666">&times;</button>
    </div>

    <style>
      .qb-layout { display:flex; gap:14px; }
      .qb-left { width:60%; }
      .qb-right { width:40%; background:#f8fafc; border:1px solid #e5e7eb; border-radius:10px; padding:10px; }
      .qb-option-row { display:grid; grid-template-columns:28px 1fr; gap:8px; align-items:center; margin:6px 0; }
      .qb-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
      .qb-table-wrap { max-height:220px; overflow:auto; border:1px solid #e5e7eb; border-radius:8px; margin-top:10px; }
      .qb-table { width:100%; border-collapse:collapse; font-size:0.9em; }
      .qb-table th,.qb-table td { border-bottom:1px solid #eef2f7; padding:8px; text-align:left; }
      .qb-table tr.active { background:#eff6ff; }
      .qb-warning { margin:6px 0; padding:7px 10px; border-radius:8px; font-size:0.85em; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
      .qb-tab { border:1px solid #cbd5e1; background:#fff; color:#334155; padding:5px 10px; border-radius:6px; cursor:pointer; }
      .qb-tab.active { background:#2563eb; color:#fff; border-color:#2563eb; }
      .qb-preview-list { max-height:360px; overflow:auto; }
      @media (max-width: 980px) { .qb-layout { flex-direction:column; } .qb-left,.qb-right { width:100%; } }
    </style>

    <div class="qb-layout">
      <div class="qb-left">
        <label><b>📝 Câu hỏi:</b></label>
        <textarea id="qb-question" class="inp" rows="4" placeholder="Nhập câu hỏi (hỗ trợ LaTeX)"></textarea>

        <label><b>Đáp án:</b></label>
        <div class="qb-option-row"><input type="radio" name="qb-correct" value="A"><input id="qb-opt-A" class="inp" placeholder="A"></div>
        <div class="qb-option-row"><input type="radio" name="qb-correct" value="B"><input id="qb-opt-B" class="inp" placeholder="B"></div>
        <div class="qb-option-row"><input type="radio" name="qb-correct" value="C"><input id="qb-opt-C" class="inp" placeholder="C"></div>
        <div class="qb-option-row"><input type="radio" name="qb-correct" value="D"><input id="qb-opt-D" class="inp" placeholder="D"></div>
        <div class="qb-option-row"><input type="radio" name="qb-correct" value="E"><input id="qb-opt-E" class="inp" placeholder="E"></div>

        <label><b>💡 Lời giải/Hướng dẫn:</b></label>
        <textarea id="qb-explain" class="inp" rows="3" placeholder="Nhập lời giải"></textarea>

        <div class="qb-toolbar">
          <button class="btn" style="width:auto; background:#2563eb" onclick="app.qbAddQuestion()">Thêm câu hỏi</button>
          <button class="btn" style="width:auto; background:#dc2626" onclick="app.qbDeleteSelected()">Xóa</button>
          <button class="btn" style="width:auto; background:#6b7280" onclick="app.qbResetForm()">Reset form</button>
          <button class="btn" style="width:auto; background:#0ea5e9" onclick="app.qbImportJSON()">Import JSON</button>
          <button class="btn" style="width:auto; background:#7c3aed" onclick="app.qbExportJSON()">Export JSON</button>
          <input type="file" id="qb-json-file" accept="application/json" style="display:none">
        </div>

        <div style="margin-top:10px; font-weight:600; color:#334155">Danh sách câu hỏi:</div>
        <div class="qb-table-wrap">
          <table class="qb-table">
            <thead><tr><th style="width:44px">#</th><th>Câu hỏi</th><th style="width:52px">ĐA</th></tr></thead>
            <tbody id="qb-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="qb-right">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <b>📋 Xem trước</b>
          <span id="qb-stats" style="font-size:0.85em; color:#475569">0/0 câu</span>
        </div>

        <div style="margin:8px 0; display:flex; gap:6px;">
          <button id="qb-tab-current" class="qb-tab active" onclick="app.qbSetTab('current')">Câu hiện tại</button>
          <button id="qb-tab-all" class="qb-tab" onclick="app.qbSetTab('all')">Xem trước hết</button>
        </div>

        <div id="qb-warnings"></div>
        <div id="qb-preview" class="qb-preview-list"></div>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:14px; border-top:1px solid #e5e7eb; padding-top:12px;">
      <button id="btn-qb-submit" class="btn" style="width:auto; background:#059669" onclick="app.qbSubmitAll()">Nhập đề</button>
      <button class="btn" style="width:auto; background:#6b7280" onclick="app.closeImportModal()">Đóng</button>
    </div>
  </div>
</div>
