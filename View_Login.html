<div id="view-login" style="display:block; max-width:400px; margin:0 auto; padding-top:20px;">
  <h2 style="text-align:center; color:#2563eb; margin-bottom:20px;">ĐĂNG NHẬP</h2>
  <div style="margin-bottom:15px;"><label style="font-weight:bold; color:#374151;">Tài khoản / Email:</label><input type="text" id="u" class="inp" placeholder="Nhập tài khoản..."></div>
  <div style="margin-bottom:20px;"><label style="font-weight:bold; color:#374151;">Mật khẩu:</label><input type="password" id="p" class="inp" placeholder="Nhập mật khẩu..." onkeypress="if(event.keyCode==13) app.login()"></div>
  <button onclick="app.login()" class="btn" style="font-size:1.1em; text-transform:uppercase;">Đăng nhập</button>
  <p id="login-msg" style="color:#dc2626; text-align:center; margin-top:15px; font-weight:bold; min-height:20px;"></p>
  <div style="text-align:center; margin-top:30px; font-size:0.85em; color:#6b7280; border-top:1px solid #eee; padding-top:15px;">Hệ thống trắc nghiệm & Ôn tập<br><i>Vui lòng liên hệ thầy Võ Tấn Duy nếu quên mật khẩu.</i></div>
</div>
